<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:T;src:url("file:///C:/Users/PC/Desktop/lagta/static/fonts/Tajawal-ExtraBold.ttf");font-weight:800}
@font-face{font-family:T;src:url("file:///C:/Users/PC/Desktop/lagta/static/fonts/Tajawal-Bold.ttf");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a0a0f}
body{font-family:T,"Segoe UI Emoji",sans-serif;color:#fff;position:relative}
#amb{position:absolute;inset:-200px;background:
  radial-gradient(700px 520px at 85% 8%,rgba(244,63,94,.32),transparent 70%),
  radial-gradient(640px 520px at 5% 30%,rgba(251,146,60,.20),transparent 70%),
  radial-gradient(700px 600px at 50% 105%,rgba(244,63,94,.18),transparent 70%)}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.c{left:50%;transform:translate(-50%,0)}
.txt{width:1040px;text-align:center;font-weight:800;line-height:1.25;white-space:nowrap}
.grad{background:linear-gradient(100deg,#fbbf24,#fb923c 35%,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.story{width:620px;height:860px;border-radius:44px;background:linear-gradient(160deg,#3b0d1c,#7c2d12 60%,#1f0a0f);
  border:2px solid rgba(255,255,255,.12);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.bar{position:absolute;top:26px;left:26px;right:26px;height:8px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:8px}
.story .big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tile{width:150px;height:150px;border-radius:50%;padding:7px;background:conic-gradient(#fbbf24,#f43f5e,#a21caf,#fb923c,#fbbf24)}
.tile b{display:flex;width:100%;height:100%;border-radius:50%;background:#15151c;border:5px solid #0a0a0f;align-items:center;justify-content:center;font-size:66px}
.chip{display:flex;align-items:center;gap:22px;width:820px;padding:30px 40px;border-radius:34px;background:rgba(255,255,255,.06);
  border:2px solid rgba(255,255,255,.12);font-size:56px;font-weight:800}
.chip span{font-size:64px}
.btn{padding:30px 70px;border-radius:999px;background:linear-gradient(100deg,#fb923c,#f43f5e);font-size:60px;font-weight:800;
  box-shadow:0 18px 50px rgba(244,63,94,.45);white-space:nowrap}
.pill{padding:28px 56px;border-radius:999px;background:#fff;color:#0a0a0f;font-size:56px;font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<div id="amb" class="a"></div>
<div id="stage" style="position:absolute;inset:0;transform:translate(-40px,-60px) scale(.92);transform-origin:50% 0">

<!-- scene 1: hook -->
<div id="story" class="a story" style="left:230px;top:250px">
  <div class="bar"><i id="barfill"></i></div>
  <div class="big"><div style="font-size:150px">🔥</div>
    <div style="font-size:120px;font-weight:800" class="grad">عرض</div>
    <div style="font-size:150px;font-weight:800;direction:ltr">-50%</div></div>
</div>
<div id="h1" class="a c txt" style="top:1200px;font-size:90px">شفت عرض بالستوري…</div>
<div id="h2" class="a c txt" style="top:1330px;font-size:90px">ورجعتله… <span class="grad">وراح!</span> 😩</div>

<!-- scene 2: scattered pages -->
<div id="tiles"></div>
<div id="p1" class="a c txt" style="top:1180px;font-size:92px">تقلّب <span id="cnt" class="grad" style="display:inline-block;min-width:150px">1</span> صفحة</div>
<div id="p2" class="a c txt" style="top:1310px;font-size:92px">حتى تلكى عرض؟ 🤯</div>

<!-- logo (scenes 3-5) -->
<img id="logo" class="a" src="file:///C:/Users/PC/Desktop/lagta/static/logo/laqta-mark.svg" style="width:760px;left:160px;top:0">

<!-- scene 3 -->
<div id="s1" class="a c txt" style="top:1010px;font-size:104px">كل عروض الموصل</div>
<div id="s2" class="a c txt" style="top:1150px;font-size:118px"><span class="grad">بمكان واحد</span> 👌</div>

<!-- scene 4 -->
<div id="ch1" class="a chip" style="left:130px;top:640px"><span>🍔</span>مطاعم وكافيهات</div>
<div id="ch2" class="a chip" style="left:130px;top:810px"><span>👕</span>ملابس وأحذية</div>
<div id="ch3" class="a chip" style="left:130px;top:980px"><span>📍</span>كل عرض على الخريطة</div>
<div id="ch4" class="a chip" style="left:130px;top:1150px"><span>💸</span>السعر قبل وبعد</div>
<div id="btn" class="a btn" style="top:1360px;left:50%">اطلب العرض</div>
<div id="tap" class="a" style="font-size:120px;top:1430px;left:640px">👆</div>
<div id="dm" class="a c txt" style="top:1530px;font-size:66px;font-weight:700;color:#e2e8f0">← توصل للمحل مباشرة 💬</div>

<!-- scene 5 -->
<div id="e1" class="a c txt" style="top:1000px;font-size:116px"><span class="grad">لا تفوّت لقطة</span> 🔥</div>
<div id="e2" class="a pill" style="top:1210px;left:50%">كل اللقطات بالرابط بالبايو 👆</div>
<div id="e3" class="a c txt" style="top:1390px;font-size:64px;font-weight:800;color:#e2e8f0;direction:ltr">lagta.onrender.com</div>

</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const out3=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const inOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
function vis(t,a,b,c,d){return out3(p(t,a,b))*(1-out3(p(t,c,d)))}
function set(el,o,tr){el.style.opacity=o;el.style.transform=tr;el.style.visibility=o<=0.001?'hidden':'visible'}
const C='translate(-50%,0) ';

const EM=['🍔','☕','👕','👟','🍕','🥤','🧁','👗','🍗','🛍️','🍩','🧢'];
const POS=[[120,330],[420,250],[730,330],[60,600],[300,520],[560,560],[830,620],[150,860],[440,800],[700,880],[260,1020],[600,1040]];
const tiles=POS.map((q,i)=>{const d=document.createElement('div');d.className='a tile';d.innerHTML='<b>'+EM[i]+'</b>';$('tiles').appendChild(d);return d});

window.render=function(t){
  $('amb').style.transform=`translate(${Math.sin(t*.5)*40}px,${Math.cos(t*.4)*30}px)`;
  // scene 1 (0 - 2.5)
  $('barfill').style.width=(p(t,0,1.7)*100)+'%';
  const sp=p(t,1.75,2.15), so=vis(t,-1,0,1.75,2.15);
  set($('story'),so,`scale(${1-0.5*out3(sp)}) rotate(${-8*sp}deg)`);
  set($('h1'),vis(t,-1,0.2,2.25,2.5),C+`translateY(${(1-out3(p(t,-1,0.2)))*40}px)`);
  set($('h2'),vis(t,0.9,1.25,2.25,2.5),C+`translateY(${(1-out3(p(t,0.9,1.25)))*50}px) scale(${0.9+0.1*back(p(t,0.9,1.3))})`);
  // scene 2 (2.5 - 5.3)
  tiles.forEach((d,i)=>{
    const a=2.5+i*0.08, k=back(p(t,a,a+0.35)), f=inOut(p(t,4.85,5.3));
    const [x,y]=POS[i], cx=465, cy=600;
    const X=x+(cx-x)*f, Y=y+(cy-y)*f+Math.sin(t*3+i)*8*(1-f);
    const o=clamp(k)*(1-p(t,5.15,5.3));
    d.style.left=X+'px';d.style.top=Y+'px';
    set(d,o,`scale(${k*(1-0.7*f)}) rotate(${Math.sin(t*2+i)*6}deg)`);
  });
  $('cnt').textContent=Math.max(1,Math.round(1+19*out3(p(t,2.7,4.3))));
  set($('p1'),vis(t,2.55,2.85,4.85,5.1),C+`translateY(${(1-out3(p(t,2.55,2.85)))*40}px)`);
  set($('p2'),vis(t,3.0,3.3,4.85,5.1),C+`translateY(${(1-out3(p(t,3.0,3.3)))*40}px)`);
  // logo (5.2 - end)
  const li=back(p(t,5.2,5.8));
  let ly=430, ls=li;               // scene 3 big & centered
  const up=inOut(p(t,8.7,9.2));    // scene 4: move up, shrink
  ly=ly+(250-ly)*up; ls=ls*(1-0.45*up);
  const dn=inOut(p(t,12.7,13.2));  // scene 5: come back
  ly=ly+(400-ly)*dn; ls=ls+(0.95-ls)*dn;
  const wob=Math.sin(t*6)*2.5*(1-p(t,5.2,7))*(t>5.2?1:0);
  set($('logo'),clamp(p(t,5.2,5.45)),`translateY(${ly}px) scale(${ls}) rotate(${wob}deg)`);
  // scene 3 text
  set($('s1'),vis(t,5.8,6.1,8.55,8.8),C+`translateY(${(1-out3(p(t,5.8,6.1)))*40}px)`);
  set($('s2'),vis(t,6.25,6.6,8.55,8.8),C+`scale(${0.85+0.15*back(p(t,6.25,6.7))})`);
  // scene 4
  ['ch1','ch2','ch3','ch4'].forEach((id,i)=>{const a=9.1+i*0.35;
    set($(id),vis(t,a,a+0.35,12.35,12.7),`translateX(${(1-out3(p(t,a,a+0.35)))*300}px)`)});
  const press=p(t,11.25,11.45), rel=p(t,11.45,11.65);
  set($('btn'),vis(t,10.7,11.0,12.35,12.7),C+`scale(${(0.8+0.2*back(p(t,10.7,11.05)))*(1-0.08*press+0.08*rel)})`);
  set($('tap'),vis(t,10.95,11.15,11.9,12.1),`translate(${-60*(1-out3(p(t,10.95,11.25)))}px,${-30*press+30*rel}px)`);
  set($('dm'),vis(t,11.6,11.9,12.35,12.7),C+`translateY(${(1-out3(p(t,11.6,11.9)))*30}px)`);
  // scene 5
  set($('e1'),vis(t,13.0,13.4,99,100),C+`scale(${0.8+0.2*back(p(t,13.0,13.45))})`);
  set($('e2'),vis(t,13.6,13.9,99,100),C+`translateY(${(1-out3(p(t,13.6,13.9)))*40}px) scale(${1+0.03*Math.sin(Math.max(0,t-14)*5)})`);
  set($('e3'),vis(t,14.0,14.3,99,100),C);
};
render(0);
</script>
</body>
</html>
