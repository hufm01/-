# Render Blueprint: يُنشئ خدمة الويب وقرصاً دائماً للبيانات والصور.
# ملاحظة: الأقراص الدائمة متاحة من خطة Starter فما فوق (مدفوعة).
services:
  - type: web
    name: lagta
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD        # تُدخلها أنت في لوحة Render، ولا تُكتب هنا
        sync: false
      - key: ZAINCASH_NUMBER       # رقم زين كاش الذي يظهر في رسالة الإحصائيات
        sync: false
      - key: CONTACT_WHATSAPP      # اختياري: رقم واتساب عام يظهر للزوار
        sync: false
      - key: TELEGRAM_BOT_TOKEN    # اختياري: توكن البوت من @BotFather (سرّي)
        sync: false
      - key: TELEGRAM_CHANNEL      # اختياري: اسم القناة مثل @lagta_mosul (البوت مشرف فيها)
        sync: false
      - key: TELEGRAM_CHANNEL_URL  # اختياري: رابط الانضمام للقناة إن كانت خاصة (https://t.me/+...)
        sync: false
      - key: TELEGRAM_ADMIN_CHAT   # اختياري: رقم محادثتك مع البوت لتصلك تنبيهات العروض الجديدة
        sync: false
      - key: SECRET_KEY            # اختياري
        sync: false
    disk:
      name: lagta-data
      mountPath: /data
      sizeGB: 5
